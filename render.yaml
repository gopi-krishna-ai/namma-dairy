services:
  - type: web
    name: namma-dairy
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate && npx prisma db push && node prisma/seed.js && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: JWT_SECRET
        value: "namma-dairy-jwt-super-secret-key-bengaluru-2026"
      - key: NEXT_PUBLIC_APP_NAME
        value: "Namma Dairy"
      - key: NEXT_PUBLIC_APP_TAGLINE
        value: "Pure Milk • Healthy Life"
      - key: NEXT_PUBLIC_LOCATION
        value: "Bengaluru, Karnataka"
      - key: NEXT_PUBLIC_PHONE
        value: "+91 98765 43210"
